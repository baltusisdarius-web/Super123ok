odeMap[f.depth], 'DIAGONAL', diagonal, `FRAME_DIAGONAL_H${f.height}_D${f.depth}`, f.moduleId);\n      emit(config.fixingRules.plasticCap, 'PLASTIC_CAP', f.anchoring ? 2 : 4, f.anchoring ? 'PLASTIC_TOP_CAP' : 'PLASTIC_TOP_AND_BOTTOM', f.moduleId);\n      if (f.anchoring) {\n        emit(config.fixingRules.metalBase, 'METAL_BASE', 2, 'ANCHORED_UPRIGHT_BASE', f.moduleId);\n        const anchor = config.fixingRules.anchor;\n        if (anchor?.code && Number.isSafeInteger(anchor.quantityPerUpright) && anchor.quantityPerUpright > 0) emit(anchor.code, 'FLOOR_FIX', 2 * anchor.quantityPerUpright, 'APPROVED_ANCHOR_RULE', f.moduleId);\n        else warnings.push({ status: 'REQUIRES_ANCHOR_SELECTION', rule: 'ANCHOR_CODE_AND_QUANTITY_REQUIRED', sourceModules: [`${p.id}/${f.moduleId}`] });\n      }\n      if (f.wallFixing) emit(config.fixingRules.wallFix, 'WALL_FIX', 1, 'WALL_FIX_PER_FRAME', f.moduleId);\n    }\n    for (const m of p.modules) {\n      const ordinary = m.shelfLevels - (m.tyreLevels ?? 0);\n      emit(config.beamMap[m.length].code, 'BEAM', ordinary * 2, `BEAM_L${m.length}`, m.id);\n      emit(config.fixingRules.beamClip, 'BEAM_CLIP', ordinary * 4, 'TWO_CLIPS_PER_BEAM', m.id);\n      if (m.depth === config.cuttingRules.depth) {\n        cuttingDemand.push({ positionId: p.id, sourceModule: `${p.id}/${m.id}`, full300: Math.floor(m.length / config.cuttingRules.fullWidth) * ordinary, required150: (m.length % config.cuttingRules.fullWidth) / config.cuttingRules.halfWidth * ordinary });\n      } else {\n        const composition = m.panelAlternative === '4x450' ? [[450, 4]] : config.panelComposition[m.length];\n        if (!composition) warnings.push({ status: 'MISSING_RULE', rule: 'PANEL_COMPOSITION', sourceModules: [`${p.id}/${m.id}`] });\n        else for (const [width, count] of composition) emit(config.panelCodeMap[width]?.[m.depth], 'SHELF_PANEL', count * ordinary, `SHELF_PANEL_L${m.length}_D${m.depth}_${width}`, m.id);\n      }\n      if (m.connectionType.startsWi ht, shelfLoadKg: config.loadMap[m.length], frameLoadKg: config.frameLoadKg, stabilityRatio: m.height / m.depth })),\n  };\n}\n", "geometry-bom/src/index.js": "import { rules } from './rules.js';\nimport { validateProject, auditResult } from './validation.js';\nimport { geometryForPosition } from './geometry.js';\nimport { buildTechnicalBom } from './bom.js';\nexport { rules } from './rules.js';\nexport { calcStraightLength, calcCornerWallLength, requiresWallFixing, calcFrameBraces, tyreFit } from './geometry.js';\nexport { LocalDataProvider, DriveDataProvider, CachedDataProvider } from './providers.js';\nexport { calculateCutting } from './bom.js';\nexport { validateProject, auditResult } from './validation.js';\n\n/** Pure calculation. No clock, network, filesystem, pricing strategy or inventory reads. */\nexport function calculateProject(project, options = {}) {\n  const config = options.config ?? rules;\n  const inputIssues = validateProject(project, config);\n  const provenance = { rulesVersion: config.version, dataVersion: options.snapshot?.dataVersion ?? null, dataSnapshotId: options.snapshot?.dataSnapshotId ?? null, lastSyncTime: options.snapshot?.lastSyncTime ?? null, usingCachedData: options.snapshot?.usingCachedData ?? false };\n  if (inputIssues.length) return { status: 'REQUIRES_VERIFICATION', provenance, geometry: [], technicalValidation: { valid: false, issues: inputIssues, checks: [] }, bom: [], cuttingInstructions: null, warnings: inputIssues, pricingResult: { status: 'NOT_EVALUATED' }, inventoryResult: { status: 'UNKNOWN' }, readyForOrder: false };\n  const geometry = project.positions.map(p => geometryForPosition(p, config));\n  const result = buildTechnicalBom(project, geometry, { config, components: options.snapshot?.components ?? {} });\n  const checks = auditResult(project, geometry, result.bom, result.cutting, config);\n  const issues = [...result.warnings, ...checks.filter(c => c.status === 'FAIL').map(c => ({ status: 'REQUIRES_VERIFICATION',
